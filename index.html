<html>
<head>
    <title>Bootstrap Block Layout</title>

    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet"
    >

    <style>
        .top { height: 70px; background-color: #E6E7EB; }
        .mid { height: 90px; background-color: #6B707D; }
        .left { height: 550px; background-color: #45548D; }
        .right { height: 550px; background-color: #52586A; }
        .bottom { height: 70px; background-color: #43080A; }
    </style>
</head>

<body>

    <div class="container-fluid top"></div>

    <div class="container-fluid mid"></div>

    <div class="container-fluid">
        <div class="row g-0">
            <div class="col-12 col-md-6 left"></div>
            <div class="col-12 col-md-6 right"></div>
        </div>
    </div>

    <div class="container-fluid bottom"></div>

</body>
</html>
